name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22        # ← звір із ci.yml
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run build       # ← прибери, якщо playwright.config сам підіймає сервер

      - name: Regenerate baselines
        run: npx playwright test --project=visual --update-snapshots
        continue-on-error: true

      - name: Commit baselines
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "test(visual): add linux baselines generated on the CI runner"
          git push
