name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NEXT_PUBLIC_SITE_URL: https://lintel-engineering.com

jobs:
  # Static analysis stands alone so a type or lint error reports in seconds
  # instead of behind a build and a browser download.
  static:
    name: Types, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Route and root-param types live in .next/types and are not committed.
      - name: Generate route types
        run: npm run typegen

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vitest
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build and bundle budget
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Fails the job if a route exceeds the first-load JS budget, so the number
      # recorded in the README cannot quietly regress.
      - name: First-load JS budget
        run: npm run report:bundle

      # The committed hash list must match what this build produced. If it
      # does not, the policy shipped to the host would not match its HTML.
      - name: CSP hashes are current
        run: git diff --exit-code -- csp-hashes.json

      # Validates every JSON-LD block in the prerendered HTML against the real
      # schema.org vocabulary: unknown types, unknown properties, and properties
      # used outside their domain. It reads the build output rather than a
      # running server, because what matters is what a crawler receives without
      # executing JavaScript.
      - name: Fetch the schema.org vocabulary
        run: curl -sSfL --retry 3 -o schemaorg.jsonld https://schema.org/version/latest/schemaorg-current-https.jsonld

      - name: Validate JSON-LD
        run: node scripts/validate-jsonld.mjs schemaorg.jsonld

  browser:
    name: E2E, accessibility, visual
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Playwright builds and serves the production output itself, configured in
      # playwright.config.ts, so every suite runs against what would deploy.
      - name: Playwright
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  links:
    name: Link check
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Built here rather than downloaded. `.next` is a hidden directory, which
      # upload-artifact v4 skips by default, so the artifact was always empty.
      # A rebuild costs about half a minute and removes the dependency.
      - name: Build
        run: npm run build

      - name: Start server
        run: |
          npx next start --port 3100 &
          npx wait-on http://127.0.0.1:3100/en --timeout 120000

      # The URL list is derived from the prerendered output, so every page the
      # build produces is checked without anyone maintaining a list. Extraction
      # of links found inside page bodies is enabled in Phase 4, once the pages
      # those links point at exist.
      - name: Collect URLs
        run: node scripts/list-urls.mjs --base http://127.0.0.1:3100 > urls.txt

      - name: Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --include-verbatim
            --max-concurrency 8
            --accept 200..=299
            urls.txt
          fail: true

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [static]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # Thresholds live in lighthouserc.json and match the budget in the brief;
      # the job fails below any of them.
      - name: Lighthouse CI
        run: npx lhci autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7

  # Runs against the live site after a push to main, not against a local
  # build. CI was green and Lighthouse scored 100 on every category while the
  # deployed site did not hydrate at all, because both measure a build on this
  # runner and a rendered document, and neither clicks anything.
  deployment:
    name: Deployed site
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Vercel builds on the same push, so wait for the new deployment to be
      # the one answering before asserting anything about it.
      - name: Wait for the deployment to update
        run: sleep 90

      - name: Verify the deployed site hydrates
        run: npm run verify:deployment -- "${{ vars.DEPLOYMENT_URL || 'https://lintel-engineering.vercel.app' }}"
